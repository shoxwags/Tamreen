name: Build Android app

# Runs every time code is pushed to main (or by hand from the Actions tab).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add the Android project files
        run: |
          flutter create . --platforms=android --org com.tamreen --project-name tamreen
          sed -i 's/android:label="tamreen"/android:label="Tamreen"/' android/app/src/main/AndroidManifest.xml
          # The app needs the internet to reach the database.
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET\|android:label" android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build the app (APK)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk Tamreen.apk

      - name: Publish as the "latest" test version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Tamreen.apk \
            --title "Tamreen test version (latest)" \
            --notes "Built from commit ${GITHUB_SHA::7}. On your Android phone: download Tamreen.apk below, open it and tap Install." \
            --prerelease
